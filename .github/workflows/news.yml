name: Update weather news

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_news.py
      - run: python scripts/update_videos.py
      - run: python scripts/update_local.py
        env:
          GOOGLE_POLLEN_KEY: ${{ secrets.GOOGLE_POLLEN_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "NorthBamaWX"
          git config user.email "northbamawx@users.noreply.github.com"
          git add news.json videos.json pollen.json roads.json archive.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update weather news, videos, pollen and roads"
            git pull --rebase origin main
            git push
          fi
